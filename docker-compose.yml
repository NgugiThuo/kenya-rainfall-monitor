services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rain
      POSTGRES_PASSWORD: rain
      POSTGRES_DB: rain
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rain -d rain"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg2://rain:rain@db:5432/rain
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "8081:80"

volumes:
  pgdata:
